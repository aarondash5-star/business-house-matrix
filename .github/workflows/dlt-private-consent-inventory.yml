name: WP Manager original consent workflow inventory (source private)
on:
  push:
    branches: [ci/dlt-wpmanager-public-runner-20261108]
    paths: [.github/workflows/dlt-private-consent-inventory.yml]
permissions:
  contents: read
jobs:
  source-workflow-index:
    name: Original private QA workflow filenames - read only
    if: github.repository == 'aarondash5-star/business-house-matrix' && github.ref == 'refs/heads/ci/dlt-wpmanager-public-runner-20261108' && github.actor == 'aarondash5-star' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: DELULUTECH_SOURCE_READ_TOKEN
    timeout-minutes: 3
    steps:
      - name: Locate original private OAuth Consent QA workflow (filenames only)
        env:
          SOURCE_TOKEN: ${{ secrets.DELULU_PRIVATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$SOURCE_TOKEN"
          gh_path='repos/aarondash5-star/delulutech/git/trees/4bff39c2acb868fad212d82c42ef4bd252041bea?recursive=1'
          paths="$(GH_TOKEN="$SOURCE_TOKEN" gh api "$gh_path" --jq '.tree[].path')"
          printf '%s\n' "$paths" | awk '/^\.github\/workflows\// {print}' | sort
          echo 'SOURCE_WORKFLOW_FILENAME_INVENTORY=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_PRIVATE_SOURCE_CONTENT_PUBLISHED=true' >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory original branch rules and required CI contexts (metadata only)
        env:
          SOURCE_TOKEN: ${{ secrets.DELULU_PRIVATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          rules_file="$RUNNER_TEMP/dlt-source-rules.json"
          if GH_TOKEN="$SOURCE_TOKEN" gh api 'repos/aarondash5-star/delulutech/rules/branches/production%2Fwp-manager' > "$rules_file" 2>/dev/null; then
            node - "$rules_file" <<'JS'
          const fs = require('node:fs');
          const rules = JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const safe = Array.isArray(rules) ? rules.map(r => ({
            type:r.type,
            required_checks: r.type==='required_status_checks'
              ? (r.parameters?.required_status_checks || []).map(c=>({context:c.context,app_id:c.integration_id}))
              : undefined,
          })) : [];
          console.log('BRANCH_RULE_TYPES='+safe.map(x=>x.type).join(','));
          for(const entry of safe.filter(x=>x.type==='required_status_checks')) console.log('REQUIRED_CHECKS='+JSON.stringify(entry.required_checks));
          JS
            echo 'SOURCE_BRANCH_RULES_API=READ_OK' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SOURCE_BRANCH_RULES_API=UNAVAILABLE_WITH_READONLY_TOKEN'
          fi
          rm -f "$rules_file"

