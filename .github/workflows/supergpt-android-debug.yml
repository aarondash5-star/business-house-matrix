name: SuperGPT Android frontend debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supergpt-android-debug.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned Android frontend foundation
        uses: actions/checkout@v4
        with:
          repository: rikkahub/rikkahub
          ref: fa5d5f3f6fc10033111bf4d0803bf42031f60ca4
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Compile Android debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supergpt-frontend-foundation-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
