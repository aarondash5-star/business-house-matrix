name: SuperGPT Android frontend debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supergpt-android-debug.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout maintained PocketPal AI frontend
        uses: actions/checkout@v4
        with:
          repository: a-ghorbani/pocketpal-ai
          ref: main
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Disable optional Firebase benchmark integration for standalone prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          target = 'apply plugin: "com.google.gms.google-services"'
          assert s.count(target) == 1, "Upstream Gradle file changed; review before patching"
          p.write_text(s.replace(target, '// Firebase Google Services disabled for standalone CI prototype'))
          PY
      - name: Exclude optional Firebase App Check native module from prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("react-native.config.js")
          s = p.read_text()
          marker = "  dependencies: {\n"
          assert s.count(marker) == 1, "Upstream React Native config changed; review required"
          s = s.replace(marker, marker + "    '@react-native-firebase/app-check': { platforms: { android: null } },\n")
          p.write_text(s)
          PY
      - name: Build standalone Android user-test APK with bundled JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease --no-daemon --stacktrace
          if grep -R -q 'ReactNativeFirebaseAppCheckPackage' app/build/generated/autolinking 2>/dev/null; then
            echo 'ERROR: Firebase App Check remains autolinked'; exit 1
          fi
      - name: Verify standalone APK output
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/prod/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | head -n 5
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc' || { echo 'Bundled JS missing'; exit 1; }
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-android-standalone-user-test
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
