name: SMM Scheduler V1 - Certification
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Optional existing order ID for read-only status lookup'
        required: false
        type: string
  pull_request:
    paths:
      - 'smm-scheduler/**'
      - '.github/workflows/smm-scheduler-certify.yml'
permissions:
  contents: read
concurrency:
  group: smm-scheduler-certify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: smm-scheduler
    steps:
      - uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Inert scheduler smoke
        run: python scheduler.py --execute-read-only
      - name: Read-only FanSMM credential / API smoke
        if: github.event_name == 'workflow_dispatch'
        env:
          FANSMM_API_KEY: ${{ secrets.FANSMM_API_KEY }}
        run: python certify.py
      - name: Look up an existing order status (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.order_id != ''
        env:
          FANSMM_API_KEY: ${{ secrets.FANSMM_API_KEY }}
          ORDER_ID: ${{ inputs.order_id }}
        run: python status_once.py --order "$ORDER_ID"
