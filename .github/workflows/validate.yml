name: Matrix source validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Block leaked credentials and dangerous pilot settings
        run: python3 scripts/validate_public_repo.py
      - name: Compile local source without executing actions
        run: python3 -m compileall -q matrix tests scripts

  starter-tests:
    # Entire disposable GitHub-hosted VM is used only for this test job.
    # Public PR source has no persisted checkout credentials or secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build disposable public-source test image
        run: |
          docker build --pull -f ci/gate_e_sandbox.Dockerfile -t gate-e-sandbox-ci:local .
      - name: Verify complete isolated sandbox and execute full test suite
        run: |
          # OCI process has no external network or host data mounts. Only
          # SYS_ADMIN/NET_ADMIN for nested Bubblewrap's new namespaces; this
          # is NOT the same as --privileged, and applies only to the disposable
          # public-source CI container.
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=1g \
            --tmpfs /root:rw,nosuid,size=256m \
            --memory 2g --cpus 2 --pids-limit 128 \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            gate-e-sandbox-ci:local sh -ec 'python ci/verify_gate_e_ci.py && python -m pytest -q'
