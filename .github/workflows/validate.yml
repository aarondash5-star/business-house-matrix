name: Matrix source validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Block leaked credentials and dangerous pilot settings
        run: python3 scripts/validate_public_repo.py
      - name: Compile local source without executing actions
        run: python3 -m compileall -q matrix tests scripts

  starter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Matrix test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install rootless Bubblewrap test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          command -v bwrap
      - name: Run existing nine-department and approval tests
        run: python -m pytest -q
