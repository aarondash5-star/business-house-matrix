[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-house-langgraph-starter"
version = "0.1.0"
description = "Independent recursive Business House AI Matrix with LangGraph and MCP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "fastmcp>=4.0,<5",
]

[project.optional-dependencies]
mcp = ["langchain[mcp]>=1.4,<2"]
postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary]>=3,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["matrix*"]
